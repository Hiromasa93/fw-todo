<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container calendar-container">
    <h1 class="page-title" th:text="${monthLabel}">2026年 4月</h1>

    <nav class="calendar-navigation" aria-label="月の移動">
        <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
        <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
    </nav>

    <table class="calendar-table" th:attr="data-from=${firstDate},data-to=${lastDate}">
        <thead>
        <tr>
            <th scope="col">日</th>
            <th scope="col">月</th>
            <th scope="col">火</th>
            <th scope="col">水</th>
            <th scope="col">木</th>
            <th scope="col">金</th>
            <th scope="col">土</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="weekStart : ${#numbers.sequence(0, calendarDates.size() - 1, 7)}">
            <td th:each="offset : ${#numbers.sequence(0, 6)}"
                th:with="date=${calendarDates[weekStart + offset]}"
                th:attr="data-date=${date}"
                th:text="${date == null ? '' : date.getDayOfMonth()}"></td>
        </tr>
        </tbody>
    </table>
</main>
<script>
    async function loadTodos() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const res = await fetch(`/api/todos?from=${from}&to=${to}`);
        const todos = await res.json();

        document.querySelectorAll('.calendar-table [data-date]').forEach(cell => {
            const dueTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
            dueTodos.forEach(todo => {
                cell.append(document.createTextNode(todo.title));
            });
        });
    }

    loadTodos();
</script>
</body>
</html>
