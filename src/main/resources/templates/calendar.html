<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container calendar-container">
    <h1 class="page-title" th:text="${monthLabel}">2026年 4月</h1>

    <nav class="calendar-navigation" aria-label="月の移動">
        <div class="calendar-navigation-months">
            <a class="link" th:href="@{/calendar(year=${previousYear},month=${previousMonth})}">前の月</a>
            <a class="link" th:href="@{/calendar(year=${nextYear},month=${nextMonth})}">次の月</a>
        </div>
        <div class="calendar-navigation-pages">
            <a class="link" th:href="@{/todos}">表で見る</a>
            <a class="link" th:href="@{/todos/new}">新規登録</a>
        </div>
    </nav>

    <table class="calendar-table" th:attr="data-from=${firstDate},data-to=${lastDate}">
        <thead>
        <tr>
            <th scope="col">日</th>
            <th scope="col">月</th>
            <th scope="col">火</th>
            <th scope="col">水</th>
            <th scope="col">木</th>
            <th scope="col">金</th>
            <th scope="col">土</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="weekStart : ${#numbers.sequence(0, calendarDates.size() - 1, 7)}">
            <td th:each="offset : ${#numbers.sequence(0, 6)}"
                th:with="date=${calendarDates[weekStart + offset]}"
                th:attr="data-date=${date}"
                th:text="${date == null ? '' : date.getDayOfMonth()}"></td>
        </tr>
        </tbody>
    </table>
</main>
<script>
    async function loadTodos() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const res = await fetch(`/api/todos?from=${from}&to=${to}`);
        const todos = await res.json();
        const today = new Date();
        const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.calendar-table [data-date]').forEach(cell => {
            const dueTodos = todos.filter(todo => todo.dueDate === cell.dataset.date);
            dueTodos.slice(0, 3).forEach(todo => {
                const item = document.createElement('a');
                item.href = `/todos/${todo.id}/edit`;
                item.className = 'link';
                item.textContent = todo.title;
                if (todo.dueDate < todayDate && !todo.completed) {
                    item.style.color = 'red';
                }
                cell.append(item);
            });

            const remainingCount = dueTodos.length - 3;
            if (remainingCount > 0) {
                const more = document.createElement('div');
                more.textContent = `ほか ${remainingCount}件`;
                cell.append(more);
            }
        });
    }

    async function loadHolidays() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const res = await fetch(`/api/holidays?from=${from}&to=${to}`);
        const holidays = await res.json();

        if (res.headers.has('X-Holidays-Unavailable')) {
            const notice = document.createElement('p');
            notice.className = 'flash';
            notice.textContent = '祝日を取れませんでした';
            calendar.parentElement.insertBefore(notice, calendar);
        }

        document.querySelectorAll('.calendar-table [data-date]').forEach(cell => {
            const [year, month, day] = cell.dataset.date.split('-').map(Number);
            const weekday = new Date(year, month - 1, day).getDay();

            if (weekday === 6) {
                cell.style.backgroundColor = '#dbeafe';
            } else if (weekday === 0) {
                cell.style.backgroundColor = '#fee2e2';
            }

            if (Object.prototype.hasOwnProperty.call(holidays, cell.dataset.date)) {
                cell.style.backgroundColor = '#fef3c7';
                cell.title = holidays[cell.dataset.date];
            }
        });
    }

    loadTodos();
    loadHolidays();
</script>
</body>
</html>
